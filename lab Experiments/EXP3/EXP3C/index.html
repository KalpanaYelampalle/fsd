<!doctype html>
<html>
  <head>
    <title>Types of CSS</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      h2 {
        color: black;
        text-align: center;
      }

      p {
        color: purple;
        font-size: 20px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <h2>Roll No: 249XA33161, Name: Y KALPANA</h2>
    <h2>----Output--</h2>
    <br /><br />
    <h2>Internal CSS Example</h2>

    <p>This paragraph uses Internal CSS.</p>

    <h3 style="color: rgb(218, 39, 39); text-align: center">
      This heading uses Inline CSS.
    </h3>

    <h1>This heading uses External CSS.</h1>
    <br /><br />
    <h2>----End of the Output--</h2>
    <h2>Roll No: 249XA33161, Name: Y KALPANA</h2>
  </body>
</html>
