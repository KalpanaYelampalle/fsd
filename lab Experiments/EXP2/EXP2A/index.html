<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Table Example</title>
  </head>
  <body>
    <h2>Roll No: 249XA33161 , Name: Kalpana</h2>
    <h2>---OUTPUT---</h2>
    <h2>Student Course Result Table</h2>
    <table border="2" cellpadding="10" cellspacing="0">
      <tr>
        <th>S.No</th>
        <th>Name</th>
        <th>Year</th>
        <th>Course Name</th>
        <th>Percentage</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Kalpana</td>
        <td>III</td>
        <td>Python</td>
        <td>90</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Dhana</td>
        <td>II</td>
        <td>Java</td>
        <td>80</td>
      </tr>
      <tr>
        <td rowspan="2">3</td>
        <td rowspan="2">Ramya</td>
        <td>III</td>
        <td>ML</td>
        <td>65</td>
      </tr>
      <tr>
        <td>III</td>
        <td>SQL</td>
        <td>70</td>
      </tr>
      <tr>
        <td colspan="5" align="center">Total Students : 3</td>
      </tr>
    </table>
    <h2>Roll No: 249XA33161 , Name: Kalpana</h2>
    <h2>---END OF THE OUTPUT---</h2>
  </body>
</html>
